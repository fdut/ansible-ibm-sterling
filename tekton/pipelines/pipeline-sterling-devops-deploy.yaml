---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sterling-devops-deploy
  namespace: sterling-deployer
spec:
  tasks:
    - name: b2bi-install
      taskSpec:
        metadata: {}
        spec: null
        steps:
          - computeResources: {}
            image: 'quay.io/kishorec/sde:latest'
            name: install-b2bi
            env:
              - name: ENTITLED_REGISTRY_KEY
                valueFrom:
                  secretKeyRef:
                    name: sterling-deploy-secrets
                    key: ENTITLED_REGISTRY_KEY
            script: |
              #!/bin/bash
              set -e

              export ANSIBLE_CONFIG=./ansible.cfg

              export SI_INSTANCEID=dev01
              export SI_VERSION=6.2.2.0

              echo "Cloning Sterling automation repository"
              git clone https://github.com/fdut/ansible-ibm-sterling.git
              cd ansible-ibm-sterling

              ls -ltr

              # Set Helm version
              HELM_VERSION=v3.18.3

              # Download and extract Helm
              curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
              tar -zxvf helm.tar.gz

              # Move helm binary to a local bin directory and add to PATH
              mkdir -p /workspace/bin
              mv linux-amd64/helm /workspace/bin/helm
              chmod +x /workspace/bin/helm

              # Add it to PATH
              export PATH="/workspace/bin:$PATH"

              # Verify installation
              helm version

              echo "Running B2BI install via Ansible..."
              ansible-playbook playbooks/deploy_sb2b.yml
              echo "B2BI Ansible playbook finished"
      timeout: 24h0m0s
