              export ANSIBLE_CONFIG=./ansible.cfg

              export SSP_INSTANCEID=dev01
              export SSP_VERSION=6.2.1.1-iFix00-2025-10-15

              echo "Cloning Sterling automation repository"
              git clone https://github.com/ckpkishore/ansible-ibm-sterling.git
              cd ansible-ibm-sterling

              ls -ltr

              # Set Helm version
              HELM_VERSION=v3.18.3

              # Download and extract Helm
              curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
              tar -zxvf helm.tar.gz

              # Move helm binary to a local bin directory (e.g., /workspace/bin) and add to PATH
              mkdir -p /workspace/bin
              mv linux-amd64/helm /workspace/bin/helm
              chmod +x /workspace/bin/helm

              # Add it to PATH
              export PATH="/workspace/bin:$PATH"

              # Verify installation
              helm version

              echo "Running SSP install via Ansible..."
              ansible-playbook playbooks/deploy_ssp.yml
              echo "SSP Ansible playbook finished"
    - name: seas-install
      runAfter:
        - ssp-install
      taskSpec:
        metadata: {}
        spec: null
        steps:
          - computeResources: {}
            image: 'quay.io/kishorec/sde:latest'
            name: install-seas
            script: |
              #!/bin/bash
              set -e

              echo "=== Step 1: Environment Check ==="
              env | sort
              echo "=== Step 2: Check oc access ==="
              oc version || echo "oc failed with code $?"
              echo "=== Step 3: Check current context ==="
              oc whoami || echo "oc whoami failed with code $?"
              oc project || echo "oc project failed with code $?"
              export ENTITLED_REGISTRY_KEY="$(tasks.set-ibm-entitlement-key.results.effective-entitlement-key)"
              export ANSIBLE_CONFIG=./ansible.cfg

              export SEAS_INSTANCEID=dev01
              export SEAS_VERSION=6.1.1.2-iFix00-2025-12-18

              echo "=== Step 4: Git Clone ==="
              git clone https://github.com/ckpkishore/ansible-ibm-sterling.git || echo "Git clone failed with code $?"
              cd ansible-ibm-sterling

              echo "=== Step 5: List files ==="
              ls -ltr

              echo "=== Step 6: Helm Installation ==="
              HELM_VERSION=v3.18.3

              curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz || echo "Helm download failed with code $?"
              tar -zxvf helm.tar.gz || echo "Helm extraction failed with code $?"

              mkdir -p /workspace/bin
              mv linux-amd64/helm /workspace/bin/helm || echo "Helm move failed with code $?"
              chmod +x /workspace/bin/helm

              export PATH="/workspace/bin:$PATH"
              helm version || echo "Helm version check failed with code $?"

              echo "=== Step 7: Running Ansible Playbook ==="
              ansible-playbook playbooks/deploy_seas.yml || echo "Ansible playbook failed with code $?"
              echo "SEAS Ansible playbook finished"
    - name: scc-install
      runAfter:
        - seas-install
      taskSpec:
        metadata: {}
        spec: null
        steps:
          - computeResources: {}
            image: 'quay.io/kishorec/sde:latest'
